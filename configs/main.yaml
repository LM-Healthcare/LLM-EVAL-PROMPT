# Main experiment: 4 prompting conditions x 2 models x 2 item languages x 10 runs.
# Prompts are in English for both item languages (prompts.language: en).

experiment:
  name: main
  seed: 42

dataset:
  path: data/ITAMed
  commit: 4d70e665472958a8712519c0d1bba95c6d1571f9   # pin; update once the Zenodo version is final
  languages: [it, en]
  split_file: data/splits/eval_split.json            # frozen 300-item evaluation set
  filters:
    question_types: [case-based]
    include_images: false
  shuffle_options: true
  shuffle_seed: 2026

prompts:
  file: prompts/prompts.yaml
  language: en          # en | it | match
  conditions: [C0, C1, C2, C3]

sampling:
  runs: 10

models:
  # Closed model. Claude 5.5 models reject non-default temperature/top_p/top_k (HTTP 400),
  # so sampling uses the API defaults. `between_tools` disables up-front thinking on
  # Sonnet 5.5 (allowed at effort high or below). Opus 5.5 cannot disable thinking.
  - id: sonnet55
    backend: anthropic
    model: claude-sonnet-5-5
    max_tokens: 4096
    params: {}
    extra_body:
      thinking: {type: between_tools}
      output_config: {effort: high}
    concurrency: 8
    requests_per_minute: 200

  # Small open model served locally with vLLM (OpenAI-compatible endpoint), e.g.:
  #   vllm serve Qwen/Qwen3.5-9B --max-model-len 16384
  # Recommended non-thinking sampling from the model card; thinking disabled via the chat template.
  - id: qwen35_9b
    backend: openai_compatible
    base_url: http://localhost:8000/v1
    model: Qwen/Qwen3.5-9B
    max_tokens: 4096
    params: {temperature: 0.7, top_p: 0.8, presence_penalty: 1.5}
    extra_body:
      top_k: 20
      chat_template_kwargs: {enable_thinking: false}
    seed_per_run: true      # seed = experiment.seed * 1000 + run -> reproducible stochasticity
    concurrency: 16

  # Alternative closed model (check first which sampling/reasoning parameters it accepts):
  # - id: gpt
  #   backend: openai
  #   model: <model-id>
  #   max_tokens: 4096
  #   max_tokens_param: max_completion_tokens
  #   params: {reasoning_effort: none}
  #   concurrency: 8

analysis:
  reference_condition: C0
  oci_threshold: 80
  bootstrap: 2000
  language_contrasts: true
  annotations:
    distractor_ratings: annotations/distractor_harm_final.csv
    urgency_gold: annotations/urgency_final.csv
