[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompteval"
version = "0.2.0"
description = "Controlled evaluation of prompting strategies for medical LLMs on ITAMed: accuracy, stability, calibration and harm."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pyyaml>=6",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "openpyxl>=3.1",
  "tqdm>=4.65",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.60"]
openai = ["openai>=1.40"]
all = ["anthropic>=0.60", "openai>=1.40"]
dev = ["pytest>=7"]

[project.scripts]
prompteval = "prompteval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompteval = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
